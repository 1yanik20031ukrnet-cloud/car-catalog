<div class="admin-sidebar-stats">
    <div class="admin-sidebar-stat">
        <span class="admin-sidebar-stat-value">{{ total }}</span>
        <span class="admin-sidebar-stat-label">Всего</span>
    </div>
    <div class="admin-sidebar-stat admin-sidebar-stat--for-sale">
        <span class="admin-sidebar-stat-value">{{ for_sale }}</span>
        <span class="admin-sidebar-stat-label">В продаже</span>
    </div>
    <div class="admin-sidebar-stat admin-sidebar-stat--reserved">
        <span class="admin-sidebar-stat-value">{{ reserved }}</span>
        <span class="admin-sidebar-stat-label">Резерв</span>
    </div>
    <div class="admin-sidebar-stat admin-sidebar-stat--sold">
        <span class="admin-sidebar-stat-value">{{ sold }}</span>
        <span class="admin-sidebar-stat-label">Продано</span>
    </div>
</div>
