<a href="{% url 'admin:index' %}" class="flex font-semibold gap-3 grow items-center min-w-0">
    {% if dealer.logo %}
        <span class="flex h-[38px] items-center justify-center overflow-hidden rounded-default shrink-0 w-[38px]">
            <img src="{{ dealer.logo.url }}" alt="{{ dealer.name }}" class="h-full w-full object-cover">
        </span>
    {% else %}
        <span class="bg-primary-600 flex h-[38px] items-center justify-center rounded-default shrink-0 text-white text-xs w-[38px]">
            <span class="material-symbols-outlined md-18">directions_car</span>
        </span>
    {% endif %}
    <span class="text-important tracking-tight truncate xl:text-base">{{ dealer.name|default:"Premium Cars" }}</span>
</a>
